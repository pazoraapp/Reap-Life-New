<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Prayer</title><style>:root{--g:#245b45;--c:#f8f5ed;--m:#68766f}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#24352d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 16px}.card{background:#fff;border:1px solid #e5dfd3;border-radius:20px;padding:22px;margin-top:14px}a{color:var(--g)}.eyebrow{color:var(--m);font-size:12px;font-weight:700;letter-spacing:.08em}.prayer{font-size:18px;line-height:1.75}.note{color:var(--m);line-height:1.6}</style></head><body><main class="wrap"><a href="./index.html">← REAP LIFE</a><div id="app" class="card"><h1>🙏 Prayer</h1><p class="note">Loading prayer…</p></div></main><script>
const id=new URLSearchParams(location.search).get('id')||'PR-0001';
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('./content/library.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('library');return r.json()}).then(d=>{const x=(d.content||[]).find(a=>a.id===id&&a.type==='prayer');if(!x){app.innerHTML='<h2>Prayer not found</h2><p class="note">The prayer page is working, but this prayer is not in the approved library.</p>';return}app.innerHTML='<p class="eyebrow">REAP LIFE PRAYER</p><h1>'+esc(x.title)+'</h1><p><b>Scripture:</b> '+esc(x.scripture)+'</p><p class="prayer">'+esc(x.text)+'</p><p><a href="./message.html?id='+encodeURIComponent(x.connectedMessage||'RL-0001')+'">Return to connected message →</a></p>'}).catch(()=>{app.innerHTML='<h2>Prayer library could not be loaded.</h2><p class="note">Please check that <code>content/library.json</code> is present in the GitHub repository, then refresh the page.</p>'});
</script></body></html>
